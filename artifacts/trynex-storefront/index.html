    <style>
      @keyframes trynextSpin{to{transform:rotate(360deg)}}
      #trynext-boot-splash{min-height:100vh}

    <div id="root">
      <!-- No-JS / pre-hydration splash. React replaces this on mount. If
           React never mounts (broken bundle, stale SW, network failure)
           the splash auto-recovers after 10s by unregistering all SWs and
           reloading with a cache-buster. This guarantees no visitor ever
           stares at a totally blank white screen. -->
      <div id="trynext-boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFF8F3 0%,#FFF4EE 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px;">

         <div style="font-size:20px;font-weight:800;color:#1a1a1a;letter-spacing:-0.01em;">Trynext Lifestyle</div>
        <div style="font-size:13px;color:#94a3b8;margin-top:6px;">Loading premium custom apparel…</div>
        <div id="trynext-boot-spinner" style="margin-top:22px;width:30px;height:30px;border:3px solid #FFE0CC;border-top-color:#E85D04;border-radius:50%;animation:trynextSpin .8s linear infinite;"></div>
        <div id="trynext-boot-stuck" style="display:none;margin-top:24px;max-width:320px;">
          <div style="font-size:14px;color:#475569;margin-bottom:14px;">This is taking longer than usual. Tap below to refresh — it usually fixes it.</div>
          <button id="trynext-boot-refresh" type="button" style="background:linear-gradient(135deg,#E85D04,#FB8500);color:#fff;border:0;border-radius:14px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(232,93,4,.3);">Refresh app</button>
        </div>
        <noscript style="margin-top:24px;font-size:13px;color:#64748b;max-width:320px;display:block;">
          JavaScript is required to use Trynext Lifestyle. Please enable it in your browser settings.
        </noscript>
      </div>
    </div>
    <script>
      (function () {
        // Pre-warm the API server the instant this HTML is parsed — BEFORE
        // React even starts loading. This ensures fast first API response.
        try {
          var _apiBase = (typeof __VITE_API_BASE__ !== 'undefined' && __VITE_API_BASE__)
            ? __VITE_API_BASE__
            : '';
          fetch((_apiBase || '') + '/api/healthz', { method: 'GET', cache: 'no-store', mode: 'no-cors' }).catch(function(){});
        } catch (_) {}
      })();
    </script>
    <script>
      (function () {
        // Watchdog: if React hasn't replaced the splash after 10 seconds,
        // assume a stale Service Worker / chunk-load failure and recover.
        var stuckTimer = setTimeout(function () {
          var el = document.getElementById('trynext-boot-stuck');
          if (el) el.style.display = 'block';
        }, 10000);
        var nukeTimer = setTimeout(function () {
          // Loop guard: never auto-recover from the splash more than twice
          // per 10-minute window (per tab). After that, leave the splash
          // visible with the manual Refresh button so we don't churn.
          var k = 'trynext_splash_recover';
          var now = Date.now();
          var attempts = [];
          try {
            attempts = JSON.parse(sessionStorage.getItem(k) || '[]')
              .filter(function (t) { return now - t < 10 * 60 * 1000; });
          } catch (_) { attempts = []; }
          if (attempts.length >= 2) {
            try { console.warn('[trynext-splash] recovery loop guard tripped, leaving manual button'); } catch (_) {}
            return;
          }
          attempts.push(now);
          try { sessionStorage.setItem(k, JSON.stringify(attempts)); } catch (_) {}
          tryRecover('watchdog: React did not mount in 18s');
        }, 18000);
        // If React mounts (any child added inside #root), cancel the timers.
        var root = document.getElementById('root');
        if (root && 'MutationObserver' in window) {
          var obs = new MutationObserver(function () {
            // React mounts by replacing the splash with its own children.
            if (!document.getElementById('trynext-boot-splash')) {
              clearTimeout(stuckTimer); clearTimeout(nukeTimer); obs.disconnect();
            }
          });
          obs.observe(root, { childList: true, subtree: false });
        }
        var btn = document.getElementById('trynext-boot-refresh');
        if (btn) btn.addEventListener('click', function () {
          tryRecover('user tapped refresh from splash');
        });
        function tryRecover(reason) {
          try { console.warn('[trynext-splash] recovering:', reason); } catch (_) {}
          var done = function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set('_r', String(Date.now()));
              window.location.replace(u.toString());
            } catch (_) { window.location.reload(); }
          };
          var pending = 0, finished = false;
          function maybeDone() { if (--pending <= 0 && !finished) { finished = true; done(); } }
          try {
            if ('serviceWorker' in navigator) {
              pending++;
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); })).then(maybeDone, maybeDone);
              }, maybeDone);
            }
          } catch (_) {}
          try {
            if ('caches' in window) {
              pending++;
              caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () {}); })).then(maybeDone, maybeDone);
              }, maybeDone);
            }
          } catch (_) {}
          if (pending === 0) done();
          // Hard fallback: never wait more than 4s for SW/cache cleanup.
          setTimeout(function () { if (!finished) { finished = true; done(); } }, 4000);
        }
        // Expose for AppErrorBoundary / cache-recovery to reuse.
        window.__trynextRecover = tryRecover;
      })();
    </script>
    <!--
      data-cfasync="false" tells Cloudflare Rocket Loader to leave this script
      alone. Without it, Rocket Loader rewrites type="module" to a synthetic
      type that the browser refuses to execute, and the app stays a blank
      white screen on mobile. The vite plugin in vite.config.ts also adds
      data-cfasync="false" to every other <script> tag in the built HTML.
    -->
    <script type="module" data-cfasync="false" src="/src/main.tsx"></script>
    <script data-cfasync="false">
      // Remove Replit platform watermark badge (injected server-side on replit.com domains)
      (function () {
        var BADGE_SELECTORS = [
          '#replit-badge-container', '.replit-badge', '.replit-dev-banner',
          '[data-replit-badge]', 'iframe[title*="Replit"]',
          'iframe[src*="replit.com/badge"]', 'iframe[src*="badge.replit"]'
        ];
        function removeBadge() {
          BADGE_SELECTORS.forEach(function (sel) {
            try { document.querySelectorAll(sel).forEach(function (el) { el.remove(); }); } catch (_) {}
          });
        }
        removeBadge();
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(removeBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
