kind = "video"
previewPath = "/trynex-promo/"
title = "TryNex Promo Animation"
version = "1.0.0"
id = "artifacts/trynex-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/trynex-promo/" ]
localPort = 8083

[services.development]
run = "pnpm --filter @workspace/trynex-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trynex-promo", "run", "build" ]
publicDir = "artifacts/trynex-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8083"
BASE_PATH = "/trynex-promo/"
