services:
  - type: web
    name: trynext-lifestyle-main-render
    env: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8082"
      - key: TRYNEXT_RUNTIME_ROLE
        value: primary
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: BACKUP_SYNC_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: trynext-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # The API mounts health routes under /api; use the meaningful dependency check.
    healthCheckPath: /api/health/readiness
    healthCheckInterval: 10
    maxInstances: 3
    minInstances: 1
    autoDeploy: true

databases:
  - name: trynext-db
    databaseName: trynext_prod
    user: trynext_user
    region: oregon
    plan: starter
    postgresMajorVersion: "16"
